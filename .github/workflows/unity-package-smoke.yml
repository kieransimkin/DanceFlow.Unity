name: Unity package smoke tests (licensed)
on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: 'Installed Unity 6 editor image version (verify available GameCI tag)'
        required: true
        default: '6000.0.23f1'
        type: string
permissions:
  contents: read
  checks: write
jobs:
  unity-package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require explicitly configured Unity licence
        run: |
          if [ -z "${UNITY_LICENSE}" ] && [ -z "${UNITY_SERIAL}" ]; then
            echo 'Unity licence or serial required for real Editor tests. Configure GitHub Actions secrets.' >&2
            exit 1
          fi
      - name: Copy root UPM package into test subdirectory for GameCI package mode
        run: |
          mkdir -p test-package
          rsync -a --exclude='.git' --exclude='test-package' --exclude='Library' ./ test-package/
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: test-package
          packageMode: true
          unityVersion: ${{ inputs.unity_version }}
          testMode: all
          coverageEnabled: false
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: danceflow-unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
